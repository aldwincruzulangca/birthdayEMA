<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#a1c4fd">
    <meta name="description" content="Birthday Invitation for [Name]">
    <title>Birthday Invitation</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="container">
        <header>
            <h1>Happy Birthday!</h1>
        </header>
        
        <main>
            <div class="invitation-card">
                <div class="birthday-image">
                    <img src="birthday-icon.png" alt="Birthday Celebration">
                </div>
                <h2>Join Us for a Special Day</h2>
                <p class="date">Saturday, June 15, 2024</p>
                <p class="time">6:00 PM - 10:00 PM</p>
                <p class="location">123 Celebration Street<br>Happy Town, HT 12345</p>
                
                <div class="rsvp-section">
                    <h3>RSVP</h3>
                    <form id="rsvpForm">
                        <input type="text" id="name" placeholder="Your Name" required>
                        <input type="email" id="email" placeholder="Your Email" required>
                        <button type="submit">Confirm Attendance</button>
                    </form>
                </div>
            </div>
        </main>
        
        <footer>
            <p>Can't wait to celebrate with you!</p>
        </footer>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
