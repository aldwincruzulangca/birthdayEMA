      <div style="display: flex; gap: 14px;">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#050505" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>

        <div style="flex: 1; min-width: 0;">

          <div style="height: 9px; width: 30%; background: #e4e6ea; border-radius: 4px;"></div>

    </div>

    <!-- THE post: Birthdays invite link, shared like any normal link post -->
    <div style="background: #fff; padding: 14px 16px 6px; border-bottom: 8px solid #e9ebee;">

      <p style="font-size: 15px; color: #050505; line-height: 1.34; margin: 10px 0 12px;">You're invited! 🦄🎂 EMA is turning One — tap the link below to open her digital invitation. RSVP, leave a wish, and check out the Party Shots gallery!</p>

          <div style="position: relative; width: 100%; aspect-ratio: 9 / 19.5; background: #fff; border-radius: 24px; overflow: hidden;">
            <div style="position: absolute; top: 6px; left: 50%; transform: translateX(-50%); width: 46%; height: 18px; background: #000; border-radius: 10px; z-index: 2;"></div>
            <iframe src="https://aldwincruzulangca.github.io/Birthdays/" title="EMA's invitation, live" style="width: 100%; height: 100%; border: 0; display: block;"></iframe>
          </div>
        </div>
        <p style="text-align: center; color: #9aa0a6; font-size: 11px; margin: 8px 0 0;">↑ this is the real, live site — scroll it like a phone</p>

      <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 0; font-size: 13px; color: #65676b;">
        <span>❤️ 48</span>
        <span>12 comments &middot; 6 shares</span>

      <div style="display: flex; border-top: 1px solid #dadde1; padding-top: 4px;">
        <div style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 0; color: #65676b; font-size: 14px; font-weight: 600;">

          Like

    <!-- Another faded post below, so the real one reads as "mid-feed" -->

      <div style="display: flex; gap: 10px; align-items: center;">
        <div style="width: 40px; height: 40px; border-radius: 50%; background: #d8dde1;"></div>
